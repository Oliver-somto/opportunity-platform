<!DOCTYPE html>
<html>

<head>
  <meta charset="UTF-8">
  <meta name="viewport"
    content="width=device-width, initial-scale=1">
  <title>Scholarship</title>
  <link rel="stylesheet"
    href="/css/style.css">
  <link rel="stylesheet"
    href="/css/components.css">
  <link rel="stylesheet"
    href="/css/responsive.css">
</head>

<body>
  
  <header class="header">
    
    <div class="container">
      
      <div class="header-inner">
        
        <div class="logo">
          
          <img
            src="images/logos/logo.png"
            alt="Opportunity Platform logo">
          
        </div>
        
        <button class="menu-toggle"
          id="menu-toggle"
          aria-label="Open navigation menu"
          aria-expanded="false">
        
          <span></span>
          <span></span>
          <span></span>
          
        </button>
        
        <nav class="main-nav"
          id="navigation">
          
          <a href="scholarships.html">
            Scholarships
          </a>
          
          <a href="jobs.html">
            Jobs
          </a>
          
          <a href="internships.html">
            Internships
          </a>
          
          <a href="fellowships.html">
            Fellowships
          </a>
          
          <a href="about.html">
            About
          </a>
          
          <a href="contact.html">
            Contact
          </a>
          
        </nav>
        
      </div>
      
    </div>
    
  </header>
  
  
  <main class="main">
    
    <section class="hero">
      
      <div class="container">
        
        <div class="hero-content">
          
          <p class="hero-label">
            OPPORTUNITIES FOR YOUR
            FUTURE
          </p>
          
          <h1>
            Find Opportunities.
            <span>Build Your
              Future.</span>
          </h1>
          
          <p class="hero-description">
            Discover scholarships,
            internships, jobs,
            fellowships, and grants
            designed to help you
            achieve your goals.
          </p>
          
          <form class="hero-search">
            
            <div
              class="search-input-wrapper">
              
              <span
                class="search-icon">⌕</span>
              
              <input type="search"
                placeholder="Search for scholarships, internships, jobs..."
                aria-label="Search opportunities">
              
            </div>
            
            <button type="submit">
              Search
            </button>
            
          </form>
          
        </div>
        
      </div>
      
    </section>
    
  </main>
  
  
  <script src="/js/main.js"></script>
  
</body>

</html>
